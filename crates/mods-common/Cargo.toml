[package]
name = "mods-common"
description = "Shared helpers for the mods in this repository: command parsing, sidecar schemas, admin resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Mods ship as libraries on a GitHub Release, never through crates.io.
publish = false

[dependencies]
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# The crate is a skeleton, so each dependency is declared before the module that
# uses it. A name leaves this list when that module lands.
[package.metadata.cargo-machete]
ignored = ["serde", "thiserror"]

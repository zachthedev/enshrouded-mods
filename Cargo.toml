[workspace]
resolver = "3"
members = ["crates/mods-common", "mods/private-chests", "xtask"]
# vendor/enshrouded-ember is its own workspace; the outer one must not claim it.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zachthedev/enshrouded-mods"
authors = ["ZachTheDev <hey@zachthe.dev>"]

[workspace.dependencies]

# Ember is a separate repository, and the mods build against its crates.io
# releases. .cargo/ember-local.toml points this at the submodule in vendor/ for
# work that changes both repositories at once. A mod that reaches the engine or
# the game layer adds that crate here beside it.
ember-sdk = "0.1"

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
# Rust's tokenizer outside a procedural macro. The gate reads every lint waiver
# in a tracked .rs file from its tokens, with line numbers from span-locations.
proc-macro2 = { version = "1.0.107", default-features = false, features = [
    "span-locations",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The digest the release bundle is published with, and the one `package` holds
# Ember's loader asset to.
sha2 = "0.11.0"
# A directory that removes itself. `package` stages Ember's release assets
# outside the output directory, which holds the archive and its digest file and
# nothing else.
tempfile = "3.27.0"
# A TOML parser. The gate reads mise.toml for the version a tool is pinned to
# and mise.lock for the artifact each platform installs.
toml = "1.1.6"
# Resolves a bare program name from the absolute PATH entries alone, so the
# gate spawns an absolute path.
which = "8.0.6"
# One Win32 call: the known folders a mise child is given in place of the
# inherited ones.
windows-sys = "0.61.2"
# The archive writer for `package`. Deflate alone, through the pure-Rust zlib
# backend: a server admin extracts the bundle with whatever ships on the host,
# and every other method this crate can write needs a tool that understands it.
# The bare `deflate` feature adds a second encoder that trades build time for a
# smaller archive, which a bundle of two libraries has no use for.
zip = { version = "8.6.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[workspace.lints.rust]
missing_docs = "warn"
# A module that needs unsafe code takes an expect with a reason on its `mod`
# line, so the list of modules that hold any is the list of those attributes.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A lint waiver is an expect that names the lint it waives and says why, so a
# waiver whose lint stops firing fails the build. The level is deny, since
# clap's derive generates an allow of clippy::restriction, which rustc refuses
# under a forbid. `cargo xtask pins` refuses any attribute naming either lint,
# so no crate-level allow can turn them off.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
# A panic crossing a hook boundary into the engine C++ frames is undefined
# behavior, so a shipped mod aborts rather than unwinding. Cargo ignores this
# setting for the test and bench profiles.
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

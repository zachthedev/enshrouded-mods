[workspace]
resolver = "3"
members = ["crates/mods-common", "mods/private-chests", "xtask"]
# vendor/enshrouded-ember is its own workspace; the outer one must not claim it.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zachthedev/enshrouded-mods"
authors = ["ZachTheDev <me@zachthe.dev>"]

[workspace.dependencies]
# mods-common reaches no registry, so it carries no version requirement.
# release-plz holds the crate back from release and rewrites no requirement for
# it, while the shared workspace version moves on every release.
mods-common = { path = "crates/mods-common" }

# Ember is a separate repository. Releases pin published versions; local work
# builds against the submodule in vendor/, which is where this path points. A
# mod that reaches the engine or the game layer adds that crate here beside it.
# Cargo enforces this requirement against the vendored crate, so it tracks the
# version the submodule is pinned to rather than Ember's newest.
ember-sdk = { version = "0.1", path = "vendor/enshrouded-ember/crates/ember-sdk" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
# CommonMark and tables, for the tests that read the documentation. The HTML
# renderer and its command-line front end stay out.
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The digest the release bundle is published with, and the one `package` holds
# Ember's loader asset to.
sha2 = "0.11.0"
# A directory that removes itself. `package` stages Ember's release assets
# outside the output directory, which holds the archive and its digest file and
# nothing else.
tempfile = "3.27.0"
thiserror = "2.0.20"
# A TOML parser. The gate reads mise.toml for the version a tool is pinned to,
# and the tests read the manifests and the lockfile beside it.
toml = "1.1.6"
tracing = "0.1.44"
# A YAML parser, for the tests that read the Dependabot, zizmor and workflow
# configuration. They read UTF-8 text, so the encoding detection stays out.
yaml-rust2 = { version = "0.13.0", default-features = false }
# The archive writer for `package`. Deflate alone, through the pure-Rust zlib
# backend: a server admin extracts the bundle with whatever ships on the host,
# and every other method this crate can write needs a tool that understands it.
# The bare `deflate` feature adds a second encoder that trades build time for a
# smaller archive, which a bundle of two libraries has no use for.
zip = { version = "8.6.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
# A panic crossing a hook boundary into the engine C++ frames is undefined
# behavior, so a shipped mod aborts rather than unwinding. Cargo ignores this
# setting for the test and bench profiles.
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

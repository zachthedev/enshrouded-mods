[workspace]
resolver = "3"
members = ["crates/mods-common", "mods/private-chests", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zachthedev/enshrouded-mods"
authors = ["Zach <me@zachthe.dev>"]

[workspace.dependencies]
mods-common = { version = "0.0.0", path = "crates/mods-common" }

# Ember is a separate repository. Releases pin published versions; local work
# builds against the submodule in vendor/, which is where these paths point.
ember-enshrouded = { path = "vendor/enshrouded-ember/crates/ember-enshrouded" }
ember-holistic = { path = "vendor/enshrouded-ember/crates/ember-holistic" }
ember-sdk = { path = "vendor/enshrouded-ember/crates/ember-sdk" }

# Versions resolved against crates.io on 2026-09-17.
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"

insta = "1.48.0"
rstest = "0.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
# A panic crossing a hook boundary into the engine C++ frames is undefined
# behavior, so a shipped mod aborts rather than unwinding. Cargo ignores this
# setting for the test and bench profiles.
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

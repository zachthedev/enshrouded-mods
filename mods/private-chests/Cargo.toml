[package]
name = "private-chests"
description = "Container ownership and scope for an Enshrouded server: private, team, or public crafting pools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Mods ship as libraries on a GitHub Release, never through crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ember-sdk.workspace = true
mods-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

# The crate is a skeleton, so each dependency is declared before the module that
# uses it. A name leaves this list when that module lands.
[package.metadata.cargo-machete]
ignored = [
    "ember-sdk",
    "mods-common",
    "serde",
    "serde_json",
    "thiserror",
    "tracing",
]
